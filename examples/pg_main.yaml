# /etc/backup/jobs/pg_main.yaml
name: "pg_main"

# ==============================================================================
# SCHEDULE (Cron Syntax Guide):
#   Minute Hour Day-of-Month Month Day-of-Week
#   "0 2 * * *" = Daily at 02:00 AM
# ==============================================================================
schedule: "0 2 * * *"

format: "dump.zst"
output_dir: "/mnt/backups/postgres"

# ==============================================================================
# RETENTION POLICY (GFS - Grandfather-Father-Son)
# ==============================================================================
retention:
  keep_last: 7 # Keep minimum 7 latest backups
  gfs:
    keep_daily: 7    # Son: daily backups for 7 days
    keep_weekly: 4   # Father: weekly backups for 4 weeks
    keep_monthly: 6  # Grandfather: monthly backups for 6 months

# ==============================================================================
# WEBHOOK NOTIFICATIONS
# ==============================================================================
notifications:
  discord_webhook: "$DISCORD_WEBHOOK_URL"
  on_start: true
  on_success: true
  on_failure: true

# Target remote PostgreSQL server by IP address (e.g. 192.168.1.50 or host.docker.internal)
command: "pg_dump -h 192.168.1.50 -p 5432 -U postgres -d prod_db -Fc"
output_filename: "prod_db_{timestamp}.dump.zst"
