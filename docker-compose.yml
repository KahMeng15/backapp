version: "3.8"

services:
  backapp:
    image: ghcr.io/kahmeng/backapp:latest
    container_name: backapp
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN # Allows ionice -c 3 (idle I/O class) priority
    environment:
      - BACKUP_JOBS_DIR=/etc/backup/jobs
      - BACKAPP_SOCKET_PATH=/var/run/backapp/backapp.sock
      - LOG_LEVEL=INFO

      # Discord / Slack webhook for automated notifications (backup start, success, failure)
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}

      # Shared credentials used by hooks / database dump clients across remote servers
      - RCON_PASS=${RCON_PASS:-secret_rcon_pass}
      - PGPASSWORD=${PGPASSWORD:-postgres_password}
      - MYSQL_PWD=${MYSQL_PWD:-mysql_root_password}

    # Allows backapp to reach servers running directly on the host or other local containers
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # Job configuration files for all servers
      - ./examples:/etc/backup/jobs:ro

      # Centralized target storage for all compressed archives (.tar.zst, .dump.zst, .sql.zst)
      - ./backups:/mnt/backups

      # Multi-server source directories mounted read-only for zero-impact streaming
      # Point these to wherever your external servers store their data:
      - ./data/servers/mc_survival:/data/servers/mc_survival:ro
      - ./data/servers/mc_creative:/data/servers/mc_creative:ro

      # IPC socket volume for interactive TUI and CLI connections
      - backapp_socket:/var/run/backapp

volumes:
  backapp_socket:
