version: "3.8"

services:
  backapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: backapp:latest
    container_name: backapp
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN # Optional: allows ionice -c 3 (idle I/O class) priority
    environment:
      - BACKUP_JOBS_DIR=/etc/backup/jobs
      - BACKAPP_SOCKET_PATH=/var/run/backapp/backapp.sock
      - LOG_LEVEL=INFO
      # Discord / Slack webhook for automated notifications on backup start, success, and failure
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      # Database and Minecraft credentials used by job hooks / dump commands
      - RCON_PASS=${RCON_PASS:-secret_rcon_pass}
      - PGPASSWORD=${PGPASSWORD:-postgres}
      - MYSQL_PWD=${MYSQL_PWD:-root}
    volumes:
      # Mount directory containing *.yaml backup job specifications
      - ./examples:/etc/backup/jobs:ro
      # Storage target for standard .tar.zst, .tar.gz, .zip, .dump.zst files
      - ./backups:/mnt/backups
      # Minecraft world or local filesystem source directories
      - ./data/minecraft_world:/data/minecraft_world:ro
      # IPC socket volume for interactive TUI / CLI connections
      - backapp_socket:/var/run/backapp
    networks:
      - default

volumes:
  backapp_socket:
