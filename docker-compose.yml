services:
  backapp:
    image: ghcr.io/kahmeng/backapp:latest
    container_name: backapp
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN # Allows ionice -c 3 (idle I/O class) priority
    environment:
      # Discord / Slack webhook for automated notifications (backup start, success, failure)
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}

      # Credentials used by hooks / database dump clients across remote servers
      - RCON_PASS=${RCON_PASS:-secret_rcon_pass}
      - PGPASSWORD=${PGPASSWORD:-postgres_password}
      - MYSQL_PWD=${MYSQL_PWD:-mysql_root_password}

    volumes:
      # Job configuration files
      - ./examples:/etc/backup/jobs:ro

      # Centralized target storage for all compressed archives
      - ./backups:/mnt/backups

      # Server data directories mounted read-only for zero-impact streaming
      - ./data/servers:/data/servers:ro
