[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backapp"
version = "1.1.0"
description = "Zero-impact, production-ready backup daemon and interactive TUI with Discord webhooks and GFS retention"
readme = "README.md"
authors = [{ name = "backapp team" }]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "croniter>=6.0.0",
    "textual>=0.50.0",
    "rich>=13.0.0",
]

[project.scripts]
backapp = "backapp.cli:main"
backmc = "backapp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
