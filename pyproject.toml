[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backmc"
version = "1.0.0"
description = "Zero-impact, production-ready backup daemon and interactive TUI for Minecraft, PostgreSQL, and MySQL"
readme = "README.md"
authors = [{ name = "backmc team" }]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "croniter>=6.0.0",
    "textual>=0.50.0",
    "rich>=13.0.0",
]

[project.scripts]
backmc = "backmc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
